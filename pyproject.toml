[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "medagent-dental-prototype"
version = "9.0.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<12", "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]
[tool.setuptools]
packages = ["medagent"]
