<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口腔健康咨询</title>
<style>body{max-width:850px;margin:35px auto;padding:0 20px;background:#f4f7f6;color:#193b38;font:16px system-ui}h1{font-size:28px}article,section{padding:20px;border-radius:14px;background:white;margin:15px 0}.patient{background:#e3f0eb}textarea{width:100%;box-sizing:border-box;height:110px;padding:12px;font:inherit}button{padding:12px 20px;background:#12655e;color:white;border:0;border-radius:8px;margin:10px 0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word}small{color:#54706b}#error{color:#a32c2c}</style>
<h1>口腔健康咨询</h1><p>用自己的话描述哪里不舒服、什么时候开始。也可以上传已有病历，助手会根据需要追问。</p><small>研究版本，提供信息整理和咨询参考。</small><div id="chat" aria-live="polite"></div>
<section><textarea id="text" placeholder="例如：左边后牙喝凉水会疼，刷牙还有点出血。"></textarea><p><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></p><p>病历文本文件：<input id="record" type="file" accept=".txt,text/plain"></p><input id="token" type="password" placeholder="访问令牌（如需要）"><br><button id="send">发送</button> <button id="reset">新咨询</button><p id="error"></p></section>
<details><summary>查看分析依据与处理进度</summary><p id="detail"></p><div id="evidence"></div></details><a href="/">病历专业评估</a>
<script>
const $=x=>document.getElementById(x);let cid=null;
async function api(path,body){let r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:body===undefined?undefined:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function bubble(text,patient=false){const el=document.createElement('article');el.className=patient?'patient':'';el.style.whiteSpace='pre-wrap';el.textContent=text;$('chat').append(el)}
function renderEvidence(report){
 const names={queued:'等待处理',running:'正在分析',answered:'分析完成',awaiting_patient:'需要补充信息',needs_review:'部分信息需要核实',urgent_referral:'建议立即就医',failed:'本次处理未完成'};
 $('detail').textContent=names[report.status]||'处理中';
 const box=$('evidence');box.replaceChildren();
 for(const fact of report.evidence?.facts||[]){
  const p=document.createElement('p');const quote=document.createElement('q');quote.textContent=fact.quote;p.append(quote);
  const note=document.createElement('small');note.textContent=' '+({positive:'已描述',negative:'明确否认',unknown:'未知',conflict:'存在冲突'}[fact.status]||'待核实')+(fact.conflicts_with?.length?' · 有前后不一致信息':'');p.append(note);box.append(p);
 }
 const used=new Set(report.citations||[]);
 for(const source of report.evidence?.knowledge||[]){
  if(!used.has(source.id))continue;
  const p=document.createElement('p');p.textContent='参考资料：'+source.source;
  if(source.source_url){try{const url=new URL(source.source_url);if(['https:','http:'].includes(url.protocol)){const a=document.createElement('a');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='查看来源';p.append(' ',a)}}catch{}}
  box.append(p);
 }
}
function image(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$('reset').onclick=()=>{cid=null;$('chat').replaceChildren();$('detail').textContent='';$('evidence').replaceChildren()};
$('send').onclick=async()=>{$('send').disabled=true;$('reset').disabled=true;$('error').textContent='';try{let files=[...$('images').files];if(files.length>8||files.reduce((s,f)=>s+f.size,0)>16000000)throw Error('图片总大小请控制在16 MB以内，最多8张');let text=$('text').value;let record=$('record').files[0];let record_text=record?await record.text():'';if(!text.trim()&&!files.length&&!record_text.trim())throw Error('请先输入描述或上传病历');if(!cid)cid=(await api('/api/conversations',{})).conversation_id;let d=await api('/api/conversations/'+cid+'/messages',{text,record_text,images:await Promise.all(files.map(image))});bubble(text||'已上传病历图像',true);$('text').value='';$('images').value='';$('record').value='';while(true){d=await api('/api/runs/'+d.run_id);renderEvidence(d);if(!['queued','running'].includes(d.status))break;await new Promise(r=>setTimeout(r,800))}if(d.status==='failed')throw Error(d.error);bubble(d.answer)}catch(e){$('error').textContent=e.message}finally{$('send').disabled=false;$('reset').disabled=false}};
</script></html>
