<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedAgent - 口腔临床辅助评估系统</title>
    <style>
        :root {
            --primary: #2563EB;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --bg: #F8FAFC;
            --text: #1E293B;
            --border: #E2E8F0;
            --sidebar: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 240px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
        }

        .nav {
            flex: 1;
            padding: 16px 0;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: #F1F5F9;
        }

        .nav-item.active {
            background: #EFF6FF;
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 500;
        }

        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* 评估页面 */
        .assessment-form {
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 1000px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .task-selector {
            display: flex;
            gap: 16px;
        }

        .task-option {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-option:hover {
            border-color: var(--primary);
        }

        .task-option.selected {
            border-color: var(--primary);
            background: #EFF6FF;
        }

        .task-option h4 {
            margin-bottom: 4px;
        }

        .task-option p {
            font-size: 13px;
            color: #64748B;
        }

        .image-upload {
            border: 2px dashed var(--border);
            border-radius: 6px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: #F8FAFC;
        }

        .image-upload input {
            display: none;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1D4ED8;
        }

        .btn-primary:disabled {
            background: #94A3B8;
            cursor: not-allowed;
        }

        /* 结果显示 */
        .result-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin-top: 24px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-running {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-needs_review {
            background: #FED7AA;
            color: #9A3412;
        }

        .status-failed {
            background: #FEE2E2;
            color: #991B1B;
        }

        .result-section {
            margin-top: 24px;
        }

        .result-section h4 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .factor-list {
            list-style: none;
        }

        .factor-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .page-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h1>MedAgent</h1>
            </div>
            <nav class="nav">
                <div class="nav-item active" data-page="assessment">病历评估</div>
                <div class="nav-item" data-page="history">历史记录</div>
                <div class="nav-item" data-page="workflow">工作流可视化</div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <!-- 评估页面 -->
            <div id="assessment-page">
                <header class="header">
                    <h2>病历评估</h2>
                </header>
                <div class="content">
                    <div class="assessment-form">
                        <div class="form-group">
                            <label class="form-label">病历内容</label>
                            <textarea
                                class="form-textarea"
                                id="case-text"
                                placeholder="请输入病历原文，包括主诉、现病史、检查结果等信息..."></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">评估任务</label>
                            <div class="task-selector">
                                <div class="task-option" data-task="root_canal">
                                    <h4>根管治疗难度</h4>
                                    <p>评估根管治疗操作难度（1-4级）</p>
                                </div>
                                <div class="task-option" data-task="crack">
                                    <h4>牙隐裂风险</h4>
                                    <p>评估牙隐裂风险等级</p>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">病历图像（可选）</label>
                            <div class="image-upload" id="image-upload">
                                <input type="file" id="image-input" accept="image/*" multiple>
                                <p>点击上传或拖拽图像文件</p>
                                <p style="font-size: 13px; color: #64748B; margin-top: 8px;">支持 PNG、JPEG、WebP 格式</p>
                            </div>
                        </div>

                        <button class="btn btn-primary" id="submit-btn">开始评估</button>

                        <div id="result-container"></div>
                    </div>
                </div>
            </div>

            <!-- 历史记录页面 -->
            <div id="history-page" class="page-hidden">
                <header class="header">
                    <h2>历史记录</h2>
                </header>
                <div class="content">
                    <div class="result-card">
                        <p>历史记录功能正在开发中...</p>
                    </div>
                </div>
            </div>

            <!-- 工作流页面 -->
            <div id="workflow-page" class="page-hidden">
                <header class="header">
                    <h2>工作流可视化</h2>
                </header>
                <div class="content">
                    <div class="result-card">
                        <p>工作流可视化功能正在开发中...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;

                // 更新导航状态
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                // 切换页面
                document.querySelectorAll('[id$="-page"]').forEach(p => p.classList.add('page-hidden'));
                document.getElementById(`${page}-page`).classList.remove('page-hidden');
            });
        });

        // 任务选择
        let selectedTasks = [];
        document.querySelectorAll('.task-option').forEach(option => {
            option.addEventListener('click', () => {
                const task = option.dataset.task;
                option.classList.toggle('selected');

                if (selectedTasks.includes(task)) {
                    selectedTasks = selectedTasks.filter(t => t !== task);
                } else {
                    selectedTasks.push(task);
                }
            });
        });

        // 图像上传
        const imageUpload = document.getElementById('image-upload');
        const imageInput = document.getElementById('image-input');
        let uploadedImages = [];

        imageUpload.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            Promise.all(files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            })).then(images => {
                uploadedImages = images;
                imageUpload.innerHTML = `<p>已上传 ${images.length} 张图片</p>`;
            });
        });

        // 提交评估
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const text = document.getElementById('case-text').value.trim();

            if (!text) {
                alert('请输入病历内容');
                return;
            }

            if (selectedTasks.length === 0) {
                alert('请选择至少一个评估任务');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '评估中...';

            try {
                const response = await fetch('/api/runs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        tasks: selectedTasks,
                        images: uploadedImages
                    })
                });

                const data = await response.json();

                if (data.run_id) {
                    pollResult(data.run_id);
                } else {
                    throw new Error('未获取到运行ID');
                }
            } catch (error) {
                alert('提交失败: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '开始评估';
            }
        });

        // 轮询结果
        async function pollResult(runId) {
            const container = document.getElementById('result-container');
            container.innerHTML = '<div class="result-card"><p>正在处理...</p></div>';

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/runs/${runId}`);
                    const data = await response.json();

                    displayResult(data);

                    if (['completed', 'needs_review', 'failed'].includes(data.status)) {
                        clearInterval(interval);
                        document.getElementById('submit-btn').disabled = false;
                        document.getElementById('submit-btn').textContent = '开始评估';
                    }
                } catch (error) {
                    clearInterval(interval);
                    container.innerHTML = `<div class="result-card"><p>获取结果失败: ${error.message}</p></div>`;
                }
            }, 2000);
        }

        // 显示结果
        function displayResult(data) {
            const container = document.getElementById('result-container');
            const statusClass = `status-${data.status}`;
            const statusText = {
                'running': '运行中',
                'completed': '已完成',
                'needs_review': '需要复核',
                'failed': '失败'
            }[data.status] || data.status;

            let html = `
                <div class="result-card">
                    <h3>评估结果 <span class="status-badge ${statusClass}">${statusText}</span></h3>
                    <p style="margin-top: 8px; color: #64748B; font-size: 14px;">运行ID: ${data.run_id}</p>
            `;

            if (data.results) {
                for (const [task, result] of Object.entries(data.results)) {
                    const taskName = task === 'root_canal' ? '根管治疗难度' : '牙隐裂风险';
                    html += `
                        <div class="result-section">
                            <h4>${taskName}</h4>
                    `;

                    if (result.status === 'failed') {
                        html += `<p style="color: var(--error);">评估失败: ${result.error || '未知错误'}</p>`;
                    } else if (result.assessments) {
                        html += `<ul class="factor-list">`;
                        result.assessments.forEach(assessment => {
                            html += `<li class="factor-item">${JSON.stringify(assessment)}</li>`;
                        });
                        html += `</ul>`;
                    }

                    html += `</div>`;
                }
            }

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
